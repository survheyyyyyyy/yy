<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survei Kebutuhan Aplikasi Pendukung Penelitian Tafsir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eef4f0;
        --ink: #16302a;
        --muted: #5f7369;
        --line: #d5e2da;
        --edge: #c2d4c9;
        --brand: #148a5f;
        --brand-dark: #0d6e4a;
        --tint: #e3f4ea;
        --warm: #ffd66b;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #e8f3ec 0%, #f3f7f4 320px) fixed;
      }
      nav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 4px 16px -10px rgba(22, 48, 42, 0.25);
      }
      .trk {
        height: 10px;
        background: #dbe8e0;
        box-shadow: inset 0 2px 4px rgba(22, 48, 42, 0.22);
      }
      #progress-fill {
        height: 100%;
        width: 0;
        border-radius: 0 999px 999px 0;
        background: linear-gradient(90deg, var(--brand), #4cc58f);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4);
        transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .navin {
        max-width: 672px;
        margin: 0 auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #category-steps {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        flex: 1;
        scrollbar-width: none;
      }
      #category-steps::-webkit-scrollbar {
        display: none;
      }
      #progress-percentage {
        font-weight: 800;
        font-size: 0.9rem;
        color: var(--brand-dark);
      }
      .chip {
        flex-shrink: 0;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 5px 13px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--edge);
        box-shadow: 0 2px 0 var(--edge);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.clickable {
        cursor: pointer;
      }
      .chip.active {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
        transform: translateY(2px);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      main {
        max-width: 672px;
        margin: 24px auto 0;
        padding: 0 16px 90px;
        display: grid;
        gap: 20px;
      }
      .head {
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        padding: 30px;
        color: #fff;
        background: linear-gradient(135deg, #0d6e4a, #148a5f 55%, #27a874);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 18px 32px -18px rgba(13, 110, 74, 0.7);
      }
      .head::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -50px;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }
      .head::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 90px;
        height: 5px;
        border-radius: 0 5px 0 0;
        background: var(--warm);
      }
      .head h1 {
        position: relative;
        z-index: 1;
        margin: 0 0 12px;
        font-size: 1.7rem;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .head p {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.9);
      }
      .plabel {
        display: flex;
        justify-content: space-between;
        padding: 0 4px;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .plabel span:last-child {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 600;
      }
      #survey-form,
      .pg {
        display: grid;
        gap: 20px;
      }
      .card {
        background: #fff;
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 26px;
        box-shadow:
          inset 0 1px 0 #fff,
          0 2px 4px rgba(22, 48, 42, 0.05),
          0 18px 32px -20px rgba(22, 48, 42, 0.35);
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .card.done {
        border-color: var(--brand);
        box-shadow:
          0 0 0 3px rgba(20, 138, 95, 0.1),
          0 18px 32px -20px rgba(22, 48, 42, 0.35);
      }
      .card.missing {
        border-color: #e0483a;
        box-shadow: 0 0 0 3px rgba(224, 72, 58, 0.12);
      }
      .qhead {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        margin-bottom: 18px;
      }
      .qnum {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 0.9rem;
        color: var(--brand-dark);
        background: var(--tint);
        box-shadow: inset 0 2px 3px rgba(13, 110, 74, 0.2);
      }
      .card.done .qnum {
        background: var(--brand);
        color: #fff;
        box-shadow: 0 3px 6px -2px rgba(13, 110, 74, 0.6);
      }
      .qcat {
        margin: 0 0 3px;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--brand);
      }
      .qtext {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.45;
        font-weight: 700;
      }
      .req {
        color: #e0483a;
        margin-left: 4px;
      }
      .opts {
        display: grid;
        gap: 11px;
      }
      .scale {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
      }
      @media (min-width: 640px) {
        .scale {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        background: #fff;
        border: 1.5px solid var(--edge);
        border-radius: 14px;
        cursor: pointer;
        font-weight: 500;
        font-size: 0.92rem;
        box-shadow:
          0 2px 0 var(--edge),
          0 8px 12px -10px rgba(22, 48, 42, 0.4);
        transition:
          transform 0.12s,
          box-shadow 0.12s,
          background 0.12s;
      }
      .opt:hover {
        background: #f4fbf7;
        border-color: var(--brand);
        transform: translateY(-1px);
        box-shadow:
          0 3px 0 var(--edge),
          0 12px 16px -10px rgba(22, 48, 42, 0.4);
      }
      .opt:has(input:checked) {
        background: var(--tint);
        border-color: var(--brand);
        color: var(--brand-dark);
        font-weight: 700;
        transform: translateY(2px);
        box-shadow: inset 0 3px 6px rgba(13, 110, 74, 0.25);
      }
      .opt:focus-within {
        outline: 3px solid rgba(20, 138, 95, 0.35);
        outline-offset: 2px;
      }
      .opt input[type="radio"],
      .opt input[type="checkbox"] {
        accent-color: var(--brand);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .opt.sc {
        justify-content: center;
        text-align: center;
        min-height: 62px;
        font-size: 0.78rem;
        line-height: 1.3;
      }
      .opt.sc input {
        display: none;
      }
      .opt .lbl {
        flex: 1;
        cursor: pointer;
      }
      .oth {
        flex: 1;
      }
      textarea,
      .oi {
        width: 100%;
        font: inherit;
        font-size: 0.92rem;
        color: var(--ink);
        padding: 12px 16px;
        background: #f3f8f5;
        border: 1px solid var(--edge);
        border-radius: 14px;
        box-shadow: inset 0 3px 6px rgba(22, 48, 42, 0.13);
      }
      .oi {
        padding: 6px 12px;
      }
      textarea:focus,
      .oi:focus {
        outline: none;
        background: #fff;
        border-color: var(--brand);
        box-shadow:
          inset 0 2px 4px rgba(22, 48, 42, 0.08),
          0 0 0 4px rgba(20, 138, 95, 0.15);
      }
      #page-error {
        margin: 0;
        padding: 0 4px;
        font-size: 0.88rem;
        font-weight: 600;
        color: #b42318;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 6px;
      }
      .cta,
      .btn-ghost {
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 14px;
        padding: 15px 34px;
        cursor: pointer;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .cta {
        margin-left: auto;
        color: #fff;
        border: 2.5px solid transparent;
        background: linear-gradient(#1a9a6b, var(--brand));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 4px 0 var(--brand-dark),
          0 14px 20px -10px rgba(13, 110, 74, 0.7);
      }
      .cta:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 5px 0 var(--brand-dark),
          0 18px 24px -10px rgba(13, 110, 74, 0.7);
      }
      .cta:active {
        transform: translateY(4px);
        box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3);
      }
      .cta:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .btn-ghost {
        background: #fff;
        border: 1.5px solid var(--edge);
        color: var(--ink);
        box-shadow: 0 3px 0 var(--edge);
        padding: 15px 26px;
      }
      .btn-ghost:hover {
        background: var(--tint);
        border-color: var(--brand);
      }
      .btn-ghost:active {
        transform: translateY(3px);
        box-shadow: inset 0 3px 6px rgba(22, 48, 42, 0.2);
      }
      .cta:focus-visible,
      .btn-ghost:focus-visible {
        outline: 3px solid rgba(20, 138, 95, 0.4);
        outline-offset: 3px;
      }
      .thanks {
        text-align: center;
        padding: 40px 26px;
      }
      .thanks .qnum {
        width: 56px;
        height: 56px;
        font-size: 1.6rem;
        margin: 0 auto 14px;
        background: var(--brand);
        color: #fff;
      }
      .thanks h2 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }
      .thanks p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.7;
        color: var(--muted);
      }
      .in {
        animation: pin 0.3s ease-out;
      }
      @keyframes pin {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        .in {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="trk"><div id="progress-fill"></div></div>
      <div class="navin">
        <div id="category-steps"></div>
        <span id="progress-percentage">0%</span>
      </div>
    </nav>
    <main>
      <header class="head">
        <h1 id="survey-title">Memuat survei...</h1>
        <p id="survey-desc">Silakan tunggu sebentar.</p>
      </header>
      <div class="plabel"><span id="page-title"></span><span id="page-count"></span></div>
      <form id="survey-form" onsubmit="return false;"></form>
      <p id="page-error" hidden></p>
      <div class="foot">
        <button id="btn-prev" type="button" class="btn-ghost" onclick="goPage(currentPage - 1)">Kembali</button>
        <button id="btn-next" type="button" class="cta" onclick="nextPage()">Lanjut</button>
      </div>
    </main>

    <script>
      // GANTI dengan URL Web App Google Apps Script (berakhiran /exec)
      const SCRIPT_URL = "GANTI_DENGAN_URL_WEB_APP";

      const $ = (id) => document.getElementById(id);
      let pages = [],
        chips = [],
        currentPage = 0,
        maxReached = 0;
      let allQuestions = [],
        scales = {},
        visibleTotal = 0;
      const answeredQuestions = new Set();

      fetch("soal.json")
        .then((r) => {
          if (!r.ok) throw new Error("soal.json tidak ditemukan");
          return r.json();
        })
        .then(renderSurvey)
        .catch((e) => {
          console.error(e);
          $("survey-title").textContent = "Gagal memuat data";
          $("survey-desc").textContent = "Pastikan soal.json berada di folder yang sama dan halaman dibuka lewat server (GitHub Pages / Live Server).";
        });

      function renderSurvey(d) {
        scales = d.scales || {};
        allQuestions = d.questions;
        $("survey-title").textContent = d.title;
        $("survey-desc").textContent = d.description;

        // Kelompokkan soal per kategori
        const cats = d.categories || [],
          buckets = new Map();
        cats.forEach((c, i) => buckets.set(i, { title: c.title, questions: [] }));
        d.questions.forEach((q) => {
          let i = cats.findIndex((c) => c.id === q.category || c.title === q.category);
          if (i < 0) {
            i = "x:" + q.category;
            if (!buckets.has(i)) buckets.set(i, { title: q.category, questions: [] });
          }
          buckets.get(i).questions.push(q);
        });
        pages = [...buckets.values()].filter((p) => p.questions.length);

        const steps = $("category-steps"),
          form = $("survey-form");
        pages.forEach((p, idx) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = `${idx + 1}. ${p.title}`;
          chip.onclick = () => {
            if (idx <= maxReached) goPage(idx);
          };
          steps.appendChild(chip);
          chips.push(chip);

          const pg = document.createElement("div");
          pg.className = "pg";
          pg.id = `page-${idx}`;
          pg.hidden = true;
          p.questions.forEach((q) => pg.appendChild(buildCard(q)));
          form.appendChild(pg);
        });
        applyConditions();
        goPage(0, false);
      }

      function buildCard(q) {
        const card = document.createElement("section");
        card.className = "card";
        card.id = `card-${q.id}`;
        if (q.showIf) {
          card.hidden = true;
          card.dataset.showIf = JSON.stringify(q.showIf);
        }
        let body = "";
        if (q.type === "single" || q.type === "multiple") {
          const single = q.type === "single",
            t = single ? "radio" : "checkbox";
          body =
            '<div class="opts">' +
            q.options
              .map((o) =>
                o.toLowerCase() === "lainnya"
                  ? `<div class="opt"><input type="${t}" name="${q.id}" value="Lainnya" id="other-${q.id}" onchange="onOtherToggle('${q.id}', this.checked)"><label for="other-${q.id}" id="lbl-${q.id}" class="lbl">Lainnya</label><div id="wrap-${q.id}" class="oth" hidden><input type="text" id="in-${q.id}" class="oi" placeholder="Tuliskan lainnya..." oninput="trackProgress('${q.id}', this.value.trim())"></div></div>`
                  : `<label class="opt"><input type="${t}" name="${q.id}" value="${o}" onchange="onOptionChange('${q.id}', ${single})"><span>${o}</span></label>`,
              )
              .join("") +
            "</div>";
        } else if (q.type === "scale") {
          body =
            '<div class="scale">' + (scales[q.scale] || []).map((s) => `<label class="opt sc"><span>${s.label}</span><input type="radio" name="${q.id}" value="${s.value}" onchange="trackProgress('${q.id}')"></label>`).join("") + "</div>";
        } else if (q.type === "textarea") {
          body = `<textarea name="${q.id}" rows="4" placeholder="${q.placeholder || "Tuliskan jawaban Anda..."}" oninput="trackProgress('${q.id}', this.value.trim())"></textarea>`;
        }
        card.innerHTML = `<div class="qhead"><span class="qnum"></span><div><p class="qcat">${q.category}</p><h3 class="qtext">${q.question}${q.required ? '<span class="req">*</span>' : ""}</h3></div></div>${body}`;
        return card;
      }

      function goPage(n, scroll = true) {
        if (n < 0 || n >= pages.length) return;
        currentPage = n;
        maxReached = Math.max(maxReached, n);
        pages.forEach((_, i) => ($(`page-${i}`).hidden = i !== n));
        const el = $(`page-${n}`);
        el.classList.remove("in");
        void el.offsetWidth;
        el.classList.add("in");
        chips.forEach((c, i) => {
          c.classList.toggle("active", i === n);
          c.classList.toggle("clickable", i <= maxReached);
        });
        chips[n].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
        $("page-title").textContent = pages[n].title;
        $("page-count").textContent = `Bagian ${n + 1} dari ${pages.length}`;
        $("page-error").hidden = true;
        $("btn-prev").style.visibility = n === 0 ? "hidden" : "visible";
        $("btn-next").textContent = n === pages.length - 1 ? "Kirim jawaban" : "Lanjut";
        if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function nextPage() {
        const shown = (q) => !$(`card-${q.id}`).hidden;
        const missing = pages[currentPage].questions.filter((q) => q.required && shown(q) && !answeredQuestions.has(q.id));
        pages[currentPage].questions.forEach((q) => $(`card-${q.id}`).classList.toggle("missing", missing.includes(q)));
        if (missing.length) {
          showError("Masih ada soal wajib (*) yang belum dijawab di bagian ini.");
          $(`card-${missing[0].id}`).scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (currentPage === pages.length - 1) submitSurvey();
        else goPage(currentPage + 1);
      }

      function showError(msg) {
        const e = $("page-error");
        e.textContent = msg;
        e.hidden = false;
      }

      // ---------- Jawaban ----------
      const checkedIn = (id) => [...document.querySelectorAll(`input[name="${id}"]:checked`)];
      function setOther(id, show) {
        const lbl = $(`lbl-${id}`),
          wrap = $(`wrap-${id}`),
          inp = $(`in-${id}`);
        if (!lbl) return;
        lbl.hidden = show;
        wrap.hidden = !show;
        if (show) inp.focus();
        else inp.value = "";
      }
      function onOtherToggle(id, checked) {
        setOther(id, checked);
        trackProgress(id, checked ? true : checkedIn(id).length > 0);
      }
      function onOptionChange(id, single) {
        if (single) setOther(id, false);
        trackProgress(id, checkedIn(id).length > 0);
      }

      function trackProgress(id, val = true) {
        if (val) answeredQuestions.add(id);
        else answeredQuestions.delete(id);
        const card = $(`card-${id}`);
        card.classList.toggle("done", !!val);
        if (val) card.classList.remove("missing");
        applyConditions();
        updateProgress();
      }

      // Soal bersyarat (showIf): tampil hanya jika jawaban soal lain sesuai
      function applyConditions() {
        document.querySelectorAll("[data-show-if]").forEach((card) => {
          const c = JSON.parse(card.dataset.showIf),
            targets = [].concat(c.equals);
          const show = checkedIn(c.id).some((i) => targets.includes(i.value));
          if (!show && !card.hidden) {
            const id = card.id.replace("card-", "");
            card.querySelectorAll("input").forEach((i) => {
              if (i.type === "checkbox" || i.type === "radio") i.checked = false;
              else i.value = "";
            });
            card.querySelectorAll("textarea").forEach((t) => (t.value = ""));
            setOther(id, false);
            answeredQuestions.delete(id);
            card.classList.remove("done", "missing");
          }
          card.hidden = !show;
        });
        let n = 0;
        document.querySelectorAll("#survey-form .card").forEach((c) => {
          if (!c.hidden) c.querySelector(".qnum").textContent = ++n;
        });
        visibleTotal = n;
      }

      function updateProgress() {
        if (!visibleTotal) return;
        const pct = Math.round((answeredQuestions.size / visibleTotal) * 100);
        $("progress-percentage").textContent = pct + "%";
        $("progress-fill").style.width = pct + "%";
      }

      // ---------- Kirim ke Google Sheet ----------
      function collectAnswers() {
        const out = {};
        allQuestions.forEach((q) => {
          const card = $(`card-${q.id}`);
          if (!card || card.hidden) {
            out[q.id] = "";
            return;
          }
          if (q.type === "textarea") {
            out[q.id] = card.querySelector("textarea").value.trim();
            return;
          }
          out[q.id] = checkedIn(q.id)
            .map((i) => (i.value !== "Lainnya" ? i.value : "Lainnya: " + ($(`in-${q.id}`) ? $(`in-${q.id}`).value.trim() : "")))
            .join("; ");
        });
        return out;
      }

      async function submitSurvey() {
        const btn = $("btn-next");
        $("page-error").hidden = true;
        if (!SCRIPT_URL || SCRIPT_URL.includes("GANTI")) {
          showError("URL Google Apps Script belum diisi pada variabel SCRIPT_URL di index.html.");
          return;
        }
        btn.disabled = true;
        btn.textContent = "Mengirim...";
        const payload = {
          answers: collectAnswers(),
          questions: Object.fromEntries(allQuestions.map((q) => [q.id, q.question])),
          order: allQuestions.map((q) => q.id),
        };
        try {
          // text/plain menghindari preflight CORS pada Apps Script
          const res = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
          const result = await res.json();
          if (!result.ok) throw new Error(result.error || "Gagal menyimpan");
          showThanks();
        } catch (e) {
          console.error(e);
          showError("Jawaban belum terkirim. Periksa koneksi internet lalu coba kirim lagi.");
          btn.disabled = false;
          btn.textContent = "Kirim jawaban";
        }
      }

      function showThanks() {
        ["survey-form", "page-error", "btn-next", "btn-prev"].forEach((id) => ($(id).hidden = true));
        $("progress-fill").style.width = "100%";
        $("progress-percentage").textContent = "100%";
        const done = document.createElement("section");
        done.className = "card thanks in";
        done.innerHTML = '<div class="qnum">✓</div><h2>Terima kasih!</h2><p>Jawaban Anda sudah tersimpan dan akan digunakan untuk pengembangan aplikasi pendukung penelitian tafsir.</p>';
        document.querySelector("main").appendChild(done);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
